name: MLOps CI Pipeline

on:
  push:
    branches:
      - docker_ci

jobs:
  build_and_test_container:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run training script
        run: python train.py

      - name: Build Docker image
        run: docker build -t mlops3-image .

      - name: Run Docker container to verify model
        run: docker run --rm mlops3-image

      - name: Log in to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Push image to DockerHub
        run: |
          docker tag mlops3-image ${{ secrets.DOCKERHUB_USERNAME }}/mlops3-image
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mlops3-image
